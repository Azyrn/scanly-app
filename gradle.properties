# One JVM: Kotlin compiles inside the Gradle daemon (no second 3 GB Kotlin daemon). Run builds
# through scripts/gw, which boxes all of it in a memory cgroup so a heavy build cannot freeze the PC.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8

kotlin.code.style=official

org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.daemon=true
org.gradle.vfs.watch=true
org.gradle.workers.max=8

kotlin.incremental=true
kotlin.compiler.execution.strategy=in-process

android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false

android.enableR8.fullMode=true

# Local signed builds package only arm64; store builds: -PreleaseAbi=all.

# Off: AGP auto profiles go stale after R8 (INSTALL_BASELINE_PROFILE_FAILED).
android.experimental.art-profile-r8-rewriting=false
android.r8.dexStartupOptimization=false
android.baselineProfile.automaticGenerationDuringBuild=false
