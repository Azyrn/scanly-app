[versions]
agp = "9.4.0"
kotlin = "2.4.10"
core = "1.19.0"
coreSplashscreen = "1.2.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycle = "2.11.0"
activityCompose = "1.13.0"
composeBom = "2026.08.00"
# New dependencies
cameraX = "1.6.2"
coil = "3.6.2"
navigationCompose = "2.10.0"
accompanist = "0.37.3"
# ML Kit
mlkitBarcode = "17.3.0"
zxingcpp = "3.1.1"
# Play-services (unbundled) variant: the model ships with Google Play services, not the APK.
# 19.0.1 is what play-services-mlkit-document-scanner already resolves.
mlkitTextRecognition = "19.0.1"
mlkitDocumentScanner = "16.0.0"
onnxruntime = "1.29.0"
material3 = "1.5.0-alpha27"
datastore = "1.2.1"
hilt = "2.60.1"
hiltExt = "1.4.0"
work = "2.11.2"
# Doc chat local cache: chats and messages, opened instantly and offline.
room = "2.8.5"
ksp = "2.3.11"
serialization = "1.11.0"
firebaseBom = "34.18.0"
material = "1.14.0"
retrofit = "3.0.0"
okhttp = "5.5.0"
retrofitKotlinxConverter = "1.0.0"
# Baseline Profile
benchmarkMacro = "1.5.0-rc02"
uiautomator = "2.4.0"
profileInstaller = "1.4.1"
playServicesAds = "25.4.0"
userMessagingPlatform = "4.0.0"
leakcanary = "2.14"
credentials = "1.6.0"
googleid = "1.2.0"
# PDF editor. pdfium renders and exposes the text layer; qpdf (built from source by
# app/src/main/cpp) does the structural surgery pdfium's public API can't. See
# docs/PDF_EDITOR.md for why neither alone is enough.
pdfium = "2.0.3"
bouncycastle = "1.85"
# Signing only. Frozen upstream since Jan 2023, which rules it out for rendering but not for
# this: the incremental-update and signature-dictionary format it writes has not changed, and
# hand-rolling a byte-exact /ByteRange two-pass write is the single easiest thing here to get
# subtly, silently wrong.
pdfboxAndroid = "2.0.27.0"

[libraries]
androidx-exifinterface = { group = "androidx.exifinterface", name = "exifinterface", version = "1.4.2" }
mockito-core = { group = "org.mockito", name = "mockito-core", version = "5.14.2" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version = "1.10.2" }
androidx-core = { group = "androidx.core", name = "core", version.ref = "core" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
json = { group = "org.json", name = "json", version = "20260814" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime = { group = "androidx.lifecycle", name = "lifecycle-runtime", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
# CameraX
camerax-core = { group = "androidx.camera", name = "camera-core", version.ref = "cameraX" }
camerax-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "cameraX" }
camerax-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "cameraX" }
camerax-view = { group = "androidx.camera", name = "camera-view", version.ref = "cameraX" }
# Coil for image loading
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }
# Navigation Compose
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
# Accompanist Permissions
accompanist-permissions = { group = "com.google.accompanist", name = "accompanist-permissions", version.ref = "accompanist" }
# Material Icons Extended
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
# ML Kit
mlkit-barcode = { group = "com.google.mlkit", name = "barcode-scanning", version.ref = "mlkitBarcode" }
zxing-cpp = { group = "io.github.zxing-cpp", name = "android", version.ref = "zxingcpp" }
mlkit-text-recognition = { group = "com.google.android.gms", name = "play-services-mlkit-text-recognition", version.ref = "mlkitTextRecognition" }
mlkit-document-scanner = { group = "com.google.android.gms", name = "play-services-mlkit-document-scanner", version.ref = "mlkitDocumentScanner" }
onnxruntime-android = { group = "com.microsoft.onnxruntime", name = "onnxruntime-android", version.ref = "onnxruntime" }
# DataStore
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-android-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-lifecycle-viewmodel-compose = { group = "androidx.hilt", name = "hilt-lifecycle-viewmodel-compose", version.ref = "hiltExt" }
serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-work-runtime = { group = "androidx.work", name = "work-runtime", version.ref = "work" }
# Material Color Utilities for proper tonal palette generation
material-color-utilities = { group = "com.google.android.material", name = "material", version.ref = "material" }
# Firebase
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-auth = { group = "com.google.firebase", name = "firebase-auth" }
# Credential Manager (Google sign-in; replaces the deprecated GoogleSignInClient)
androidx-credentials = { group = "androidx.credentials", name = "credentials", version.ref = "credentials" }
androidx-credentials-play-services-auth = { group = "androidx.credentials", name = "credentials-play-services-auth", version.ref = "credentials" }
googleid = { group = "com.google.android.libraries.identity.googleid", name = "googleid", version.ref = "googleid" }
# Retrofit for network
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
retrofit-kotlinx-serialization = { group = "com.jakewharton.retrofit", name = "retrofit2-kotlinx-serialization-converter", version.ref = "retrofitKotlinxConverter" }
# Google Mobile Ads (AdMob)
play-services-ads = { group = "com.google.android.gms", name = "play-services-ads", version.ref = "playServicesAds" }
# Consent gathering (UMP). Arrives transitively with play-services-ads, but RewardedAdManager
# imports it directly, so it is declared rather than inherited.
user-messaging-platform = { group = "com.google.android.ump", name = "user-messaging-platform", version.ref = "userMessagingPlatform" }
# Baseline Profile
benchmark-macro = { group = "androidx.benchmark", name = "benchmark-macro-junit4", version.ref = "benchmarkMacro" }
uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "uiautomator" }
profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version.ref = "profileInstaller" }
# LeakCanary (debug-only heap leak detection)
leakcanary = { group = "com.squareup.leakcanary", name = "leakcanary-android", version.ref = "leakcanary" }
# PDF editor: rendering, text positions and per-char font size (which is what lets replacement
# text match the original), page deletion, and save-as-copy.
pdfium-android = { group = "io.legere", name = "pdfiumandroid", version.ref = "pdfium" }
# PKCS#7/CMS verification for embedded digital signatures. Pulls bcprov transitively; Android's
# own cut-down "BC" provider can't parse detached CMS, so SignatureValidator registers this one
# under its own name rather than replacing the platform provider.
bouncycastle-pkix = { group = "org.bouncycastle", name = "bcpkix-jdk18on", version.ref = "bouncycastle" }
# Used *only* inside the sign operation, for `saveIncrementalForExternalSigning`. Signing must
# append to the original bytes; every other path in the editor rewrites the file, which is exactly
# what invalidates a signature that is already there. pdfium and qpdf keep everything else.
pdfbox-android = { group = "com.tom-roush", name = "pdfbox-android", version.ref = "pdfboxAndroid" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-test = { id = "com.android.test", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
baselineprofile = { id = "androidx.baselineprofile", version.ref = "benchmarkMacro" }
room = { id = "androidx.room", version.ref = "room" }
